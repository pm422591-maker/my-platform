version: '3.8'
services:
  www:
    build: .
    container_name: my-gamer-site
    restart: always
    environment:
      DB_HOST: my-mysql
      DB_NAME: mywebsite
      DB_USER: appuser
      DB_PASS: ${DB_APP_PASSWORD}
    volumes:
      - uploads_data:/var/www/html/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  db:
    image: mysql:8.0
    container_name: my-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mywebsite
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "-p${DB_APP_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: my-pma
    restart: always
    environment:
      PMA_HOST: my-mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8888:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
