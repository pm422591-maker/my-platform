<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <img src="img/mini-logo.png" alt="" aria-hidden="true" class="corner-watermark">

    <div id="splash-screen">
        <svg viewBox="0 0 24 24" class="splash-logo">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
        </svg>
    </div>
    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="main-container">
        <header class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
    <img src="img/mini-logo.png" alt="Logo" class="mini-logo-img">
</div>

            <nav class="nav-links">
                <div class="nav-item">
                    <a class="nav-link" href="about.html">Про сайт</a>
                </div>
                <div class="nav-item">
                    <a class="nav-link" href="safety.html">Безпека</a>
                </div>
                <div class="nav-item">
                    <a class="nav-link" href="rules.html">Правила</a>
                </div>
                <div class="nav-item">
                    <a class="nav-link" href="support.html">Підтримка</a>
                </div>
            </nav>

            <div class="nav-spacer"></div>
        </div>
    </header>
    <div class="logo-section">
        <img src="img/logo.png" alt="Syncora Logo" class="logo-img">
        <div class="mascot-wrapper">
            <img src="img/mackot.png" alt="Mascot" class="mascot-img">
        </div>
    </div>
<div class="auth-section">
            <h1>Ласкаво просимо</h1>
            <h2>Твій ігровий світ тут</h2>

            <div class="btn-group">
                <button id="google-auth" class="btn white-btn">
                    <img src="https://img.icons8.com/color/24/google-logo.png" alt="Google"> 
                    Увійти через Google
                </button>

                <button class="btn white-btn">
                    <img src="https://img.icons8.com/ios-filled/24/mac-os.png" alt="Apple">
                    Увійти через Apple ID
                </button>

                <div class="divider">
                    <span>АБО ЧЕРЕЗ EMAIL</span>
                </div>

                <button id="btn-open-register" class="btn blue-btn">Створити акаунт</button>
                
                <p class="terms">
                    Реєструючись, ви приймаєте Умови використання та Політику конфіденційності.
                </p>
            </div>

            <div class="login-group">
                <h3>Вже є акаунт?</h3>
                <button id="btn-open-login" class="btn outline-btn">Увійти</button>
            </div>
        </div>
    </div>

    <div id="modal-register" class="modal-overlay hidden">
        <div class="modal-box">
            <span class="modal-close" data-target="modal-register">&times;</span>
            <h2>Реєстрація</h2>
            <p class="modal-subtitle">Створи свій профіль</p>
            
            <form id="form-register">
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn blue-btn full-width">Продовжити</button>
            </form>
            
            <p class="modal-footer">
                Вже маєш акаунт? <span class="link switch-to-login">Увійти</span>
            </p>
        </div>
    </div>

    <div id="modal-login" class="modal-overlay hidden">
    <div class="modal-box">
        <span class="modal-close" data-target="modal-login">&times;</span>
        <h2>Вхід</h2>
        <form id="form-login">
            <div class="input-group">
                <input type="email" id="login-email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn blue-btn full-width">Увійти</button>
        </form>
    </div>
</div>


    <script type="module">
  // 1. Імпорти
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // 2. Твоя НОВА конфігурація Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAnc1n52-LVhZ72vYSmvWv97enqqrqBBi4",
    authDomain: "mneploho-7ff8b.firebaseapp.com",
    projectId: "mneploho-7ff8b",
    storageBucket: "mneploho-7ff8b.firebasestorage.app",
    messagingSenderId: "554377149418",
    appId: "1:554377149418:web:44f345329d803c674c9093",
    measurementId: "G-LM2032YE2W"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 3. Екран завантаження
  window.addEventListener('load', () => {
    const splash = document.getElementById('splash-screen');
    if(splash) {
        setTimeout(() => {
            splash.classList.add('hidden');
            setTimeout(() => splash.remove(), 500);
        }, 2000);
    }
  });

  // 4. Функція відправки на твій PHP-сервер
  async function sendToMyServer(userData, providerName) {
      try {
          console.log("Відправка даних на сервер...", userData.email);
          
          // Автоматично визначає твій домен (localhost або localtonet)
          const response = await fetch(`${window.location.origin}/register.php`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                  email: userData.email,
                  username: userData.displayName || userData.email.split('@')[0],
                  uid: userData.uid,
                  provider: providerName
              })
          });
          
          if (!response.ok) throw new Error(`HTTP помилка! статус: ${response.status}`);

          const result = await response.json();
          
          if (result.success) {
              console.log("Дані в БД!");
              localStorage.setItem('user_name', result.username);
              localStorage.setItem('user_avatar', result.avatar);
              if (result.is_new) {
                  try { sessionStorage.setItem('syncora_new_login', '1'); } catch (e) {}
                  window.location.replace("home.html?welcome=1");
              } else {
                  window.location.replace("home.html");
              }
          } else {
              alert("Помилка БД: " + result.message);
          }
      } catch (error) {
          console.error("Помилка зв'язку:", error);
          alert("Сервер не відповідає. Перевір Аліаси в OpenServer!");
      }
  }

  // 5. Google Вхід
  const googleBtn = document.getElementById('google-auth');
  if (googleBtn) {
      googleBtn.onclick = async () => {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
            const result = await signInWithPopup(auth, provider);
            await sendToMyServer(result.user, 'google');
        } catch (error) {
            console.error("Google Error:", error);
            alert("Помилка Google: " + error.message);
        }
      };
  }

  // ======================================================
// Вставити замість блоку "// 6. Apple Вхід" в index.html
// ======================================================

  const appleImg = document.querySelector('.btn.white-btn img[alt="Apple"]');
  if (appleImg) {
      const appleBtn = appleImg.closest('button');
      appleBtn.onclick = async () => {
          const provider = new OAuthProvider('apple.com');
          provider.addScope('email');
          provider.addScope('name');
          try {
              const result = await signInWithPopup(auth, provider);
              const user = result.user;

              // Apple після першого входу дає ім'я через additionalUserInfo
              // Після повторного — displayName може бути null, це нормально
              const additionalInfo = result._tokenResponse;
              let displayName = user.displayName;

              if (!displayName && additionalInfo?.firstName) {
                  displayName = additionalInfo.firstName + ' ' + (additionalInfo.lastName || '');
              }

              await sendToServer(user, 'apple', displayName);

          } catch (error) {
              if (error.code === 'auth/popup-closed-by-user') {
                  // Юзер сам закрив — нічого не робимо
                  return;
              }
              if (error.code === 'auth/operation-not-allowed') {
                  alert("Apple Sign In не увімкнений у Firebase Console. Перейди: Authentication → Sign-in method → Apple.");
                  return;
              }
              alert("Помилка Apple ID: " + error.message);
          }
      };
  }

// ======================================================
// Замінити функцію sendToMyServer на цю універсальну:
// ======================================================

  async function sendToServer(userData, providerName, overrideName = null) {
      try {
          const username = overrideName || userData.displayName || userData.email?.split('@')[0] || 'user';

          // Apple: вибираємо endpoint
          const endpoint = providerName === 'apple' ? 'apple_auth.php' : 'register.php';

          const response = await fetch(`${window.location.origin}/${endpoint}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({
                  email:    userData.email    || '',
                  username: username,
                  uid:      userData.uid,
                  provider: providerName
              })
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const result = await response.json();

          if (result.success) {
              localStorage.setItem('user_name',   result.username);
              localStorage.setItem('user_avatar', result.avatar  || '');
              if (result.banner) localStorage.setItem('user_banner', result.banner);
              if (result.is_new) {
                  try { sessionStorage.setItem('syncora_new_login', '1'); } catch (e) {}
                  window.location.replace("home.html?welcome=1");
              } else {
                  window.location.replace("home.html");
              }
          } else {
              alert("Помилка: " + result.message);
          }
      } catch (error) {
          console.error("Помилка сервера:", error);
          alert("Сервер не відповідає. Перевір OpenServer / ngrok.");
      }
  }

// ======================================================
// В блоці "// 5. Google Вхід" — замінити sendToMyServer на sendToServer:
// ======================================================
//   await sendToServer(result.user, 'google');
</script>
<script src="js/script.js"></script>
</body>
</html>
